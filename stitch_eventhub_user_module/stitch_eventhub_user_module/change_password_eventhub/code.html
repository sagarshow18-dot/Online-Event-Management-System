<style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-group:focus-within label { color: #004ac6; }
        .input-group:focus-within .material-symbols-outlined { color: #004ac6; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center py-margin-desktop px-margin-mobile md:px-margin-desktop">
<main class="w-full max-w-md bg-surface-container-lowest rounded-lg border border-surface-variant shadow-[0_1px_3px_0_rgba(0,0,0,0.05)] overflow-hidden">
<!-- Header Section -->
<div class="px-stack-lg pt-stack-lg pb-stack-md border-b border-surface-variant bg-surface-container-lowest">
<div class="flex items-center gap-stack-sm mb-stack-sm text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
<h1 class="text-headline-md font-headline-md text-on-surface">Change Password</h1>
</div>
<p class="text-body-sm font-body-sm text-on-surface-variant">
                Ensure your account is using a long, random password to stay secure.
            </p>
</div>
<!-- Form Section -->
<form class="p-stack-lg flex flex-col gap-stack-lg" onsubmit="event.preventDefault(); alert('Password changed successfully (mock)');">
<div class="flex flex-col gap-stack-md">
<!-- Current Password -->
<div class="input-group relative flex flex-col gap-base">
<label class="text-label-md font-label-md text-on-surface-variant transition-colors" for="current_password">Current Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] transition-colors">key</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-body-md font-body-md text-on-surface placeholder:text-outline/70 transition-all shadow-sm" id="current_password" name="current_password" placeholder="Enter current password" required="" type="password"/>
</div>
</div>
<!-- New Password -->
<div class="input-group relative flex flex-col gap-base">
<label class="text-label-md font-label-md text-on-surface-variant transition-colors" for="new_password">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] transition-colors">lock</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-body-md font-body-md text-on-surface placeholder:text-outline/70 transition-all shadow-sm" id="new_password" minlength="8" name="new_password" placeholder="Enter new password" required="" type="password"/>
</div>
<p class="text-label-sm font-label-sm text-outline mt-1">Must be at least 8 characters long.</p>
</div>
<!-- Confirm New Password -->
<div class="input-group relative flex flex-col gap-base">
<label class="text-label-md font-label-md text-on-surface-variant transition-colors" for="confirm_password">Confirm New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] transition-colors">swipe_left_alt</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-body-md font-body-md text-on-surface placeholder:text-outline/70 transition-all shadow-sm" id="confirm_password" minlength="8" name="confirm_password" placeholder="Confirm new password" required="" type="password"/>
</div>
</div>
</div>
<!-- Actions -->
<div class="pt-stack-sm flex justify-end gap-stack-md border-t border-surface-variant mt-stack-sm pt-stack-lg">
<button class="px-4 py-2 rounded text-label-md font-label-md text-secondary border border-outline-variant hover:bg-surface-container-low transition-colors h-10 flex items-center justify-center" type="button">
                    Cancel
                </button>
<button class="px-4 py-2 rounded bg-primary-container text-on-primary font-label-md text-label-md hover:opacity-90 transition-opacity h-10 flex items-center justify-center shadow-sm" type="submit">
                    Change Password
                </button>
</div>
</form>
</main>
<script>
        // Basic validation mock
        const form = document.querySelector('form');
        const newPassword = document.getElementById('new_password');
        const confirmPassword = document.getElementById('confirm_password');

        form.addEventListener('submit', (e) => {
            if (newPassword.value !== confirmPassword.value) {
                e.preventDefault();
                alert('New passwords do not match.');
                confirmPassword.focus();
            }
        });
    </script>
</body></html>
