<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - EventHub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#656d84",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface-bright": "#f7f9fb",
                        "on-surface": "#191c1e",
                        "error-container": "#ffdad6",
                        "secondary-container": "#d0e1fb",
                        "on-secondary-fixed-variant": "#38485d",
                        "surface-tint": "#0053db",
                        "surface-container-highest": "#e0e3e5",
                        "surface-container": "#eceef0",
                        "primary": "#004ac6",
                        "on-background": "#191c1e",
                        "inverse-primary": "#b4c5ff",
                        "tertiary": "#4d556b",
                        "surface-variant": "#e0e3e5",
                        "tertiary-fixed-dim": "#bec6e0",
                        "tertiary-fixed": "#dae2fd",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface": "#f7f9fb",
                        "background": "#f7f9fb",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-surface-variant": "#434655",
                        "on-secondary-container": "#54647a",
                        "on-tertiary-fixed": "#131b2e",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#d3e4fe",
                        "error": "#ba1a1a",
                        "inverse-surface": "#2d3133",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-primary-container": "#eeefff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "primary-container": "#2563eb",
                        "outline-variant": "#c3c6d7",
                        "surface-container-high": "#e6e8ea",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-dim": "#d8dadc",
                        "on-tertiary-container": "#eef0ff",
                        "primary-fixed": "#dbe1ff",
                        "surface-container-low": "#f2f4f6",
                        "outline": "#737686",
                        "on-primary-fixed": "#00174b",
                        "secondary": "#505f76",
                        "on-tertiary-fixed-variant": "#3f465c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "margin-mobile": "16px",
                        "stack-lg": "24px",
                        "margin-desktop": "32px",
                        "gutter": "24px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-container-low text-on-surface">
<main class="w-full max-w-md">
<!-- Brand Header -->
<div class="text-center mb-stack-lg">
<h1 class="text-headline-lg font-headline-lg text-primary mb-stack-sm">EventHub</h1>
<p class="text-body-md font-body-md text-secondary">Create your professional account to manage and attend events.</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-margin-desktop">
<h2 class="text-headline-md font-headline-md mb-stack-lg text-on-surface">Register</h2>
<form class="space-y-stack-md">
<!-- Full Name -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-stack-sm" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">person</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed transition-all h-[40px]" id="fullName" name="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-stack-sm" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">mail</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed transition-all h-[40px]" id="email" name="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<!-- Contact Number -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-stack-sm" for="contact">Contact Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">call</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed transition-all h-[40px]" id="contact" name="contact" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-stack-sm" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">lock</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed transition-all h-[40px]" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-stack-sm" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">lock_reset</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed transition-all h-[40px]" id="confirmPassword" name="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-2 pt-2">
<input class="mt-1 h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary-fixed" id="terms" name="terms" type="checkbox"/>
<label class="text-body-sm font-body-sm text-secondary" for="terms">
                        I agree to the <a class="text-primary hover:underline font-label-md" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-label-md" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary h-[48px] rounded-lg text-label-md font-label-md hover:bg-primary transition-colors flex items-center justify-center gap-2 mt-stack-lg shadow-sm" type="submit">
                    Register Account
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Login Link -->
<div class="text-center mt-stack-lg">
<p class="text-body-sm font-body-sm text-secondary">
                Already have an account? 
                <a class="text-primary hover:underline font-label-md" href="#">Login here</a>
</p>
</div>
</main>
</body></html>
