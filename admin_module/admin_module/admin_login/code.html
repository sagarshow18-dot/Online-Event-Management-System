<body class="h-full bg-background flex flex-col antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Main Content Area (No Navigation Shell) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Abstract Background Element -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-secondary-container blur-[100px] mix-blend-multiply"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] rounded-full bg-surface-container-high blur-[120px] mix-blend-multiply"></div>
</div>
<!-- Login Container -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl border border-outline-variant relative z-10 shadow-[0_4px_12px_rgba(0,0,0,0.05)]">
<!-- Branding Header -->
<div class="pt-xl px-xl pb-lg flex flex-col items-center border-b border-outline-variant">
<div class="h-12 w-12 bg-primary rounded-lg flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">
                        domain
                    </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary text-center">
                    EventHub
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs text-center">
                    Enterprise Administration
                </p>
</div>
<!-- Login Form -->
<form action="#" class="p-xl flex flex-col gap-lg" method="POST">
<!-- Security Notice -->
<div class="flex items-start gap-sm bg-surface-container-low p-sm rounded border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant text-[18px] mt-xs">
                        lock
                    </span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Secure connection established. Unauthorized access is strictly prohibited.
                    </p>
</div>
<!-- Username/Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-xs uppercase" for="email">
                        Admin ID or Email
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">
                                badge
                            </span>
</div>
<input autocomplete="username" class="block w-full pl-[36px] pr-sm py-sm font-body-md text-body-md text-on-surface bg-surface border-outline-variant rounded focus:border-tertiary focus:ring-2 focus:ring-tertiary-container focus:outline-none transition-shadow" id="email" name="email" placeholder="e.g., admin@eventhub.com" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-caps text-label-caps text-on-surface uppercase" for="password">
                            Password
                        </label>
<a class="font-body-sm text-body-sm text-tertiary hover:underline transition-all" href="#">
                            Forgot Password?
                        </a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">
                                key
                            </span>
</div>
<input autocomplete="current-password" class="block w-full pl-[36px] pr-[36px] py-sm font-body-md text-body-md text-on-surface bg-surface border-outline-variant rounded focus:border-tertiary focus:ring-2 focus:ring-tertiary-container focus:outline-none transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">
                                visibility
                            </span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-sm">
<button class="w-full flex items-center justify-center gap-sm bg-primary text-on-primary py-sm px-lg rounded font-label-caps text-label-caps uppercase hover:opacity-90 active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                        Authenticate
                        <span class="material-symbols-outlined text-[18px]">
                            login
                        </span>
</button>
</div>
</form>
</div>
</main>
<!-- Footer Component Integration (from JSON) -->
<footer class="w-full py-md border-t border-outline-variant bg-surface-container-lowest flex justify-center items-center gap-lg px-lg mt-auto z-10 relative">
<div class="flex flex-col md:flex-row items-center justify-between w-full max-w-[1440px] gap-md">
<span class="font-label-caps text-label-caps text-secondary">
                © 2024 EventHub Enterprise. All rights reserved.
            </span>
<div class="flex items-center gap-lg">
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">
                    Security Policy
                </a>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">
                    Terms of Service
                </a>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">
                    Help Center
                </a>
</div>
</div>
</footer>
