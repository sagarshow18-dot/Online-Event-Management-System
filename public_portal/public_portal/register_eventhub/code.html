<!DOCTYPE html>

<style type="text/tailwindcss">
        @layer utilities {
            .input-base {
                @apply h-[48px] w-full rounded-lg border border-[#dadce0] bg-surface-container-lowest px-4 text-on-surface font-body-md focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-colors;
            }
            .label-base {
                @apply block mb-1 font-label-md text-label-md text-on-surface-variant;
            }
        }
    </style>
</head>
<body class="bg-surface text-on-background min-h-screen flex flex-col font-body-md h-full selection:bg-primary-container selection:text-on-primary-container">
<!-- TopNavBar Suppressed: Linear/Transactional Intent (Sign-up) -->
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-surface-container-low">
<div class="max-w-md w-full bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden flex flex-col">
<!-- Branding Header (Fallback since TopNav is suppressed) -->
<div class="px-8 pt-8 pb-6 text-center border-b border-surface-variant">
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">EventHub</h1>
<p class="mt-2 font-body-sm text-body-sm text-on-surface-variant">Create your EventHub Account</p>
</div>
<!-- Form Container -->
<div class="px-8 py-8">
<form action="#" class="space-y-6" method="POST">
<div class="space-y-4">
<!-- Full Name -->
<div>
<label class="label-base" for="fullName">Full Name</label>
<input autocomplete="name" class="input-base" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- Email -->
<div>
<label class="label-base" for="email">Email</label>
<input autocomplete="email" class="input-base" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<!-- Contact Number -->
<div>
<label class="label-base" for="phone">Contact Number</label>
<input autocomplete="tel" class="input-base" id="phone" name="phone" placeholder="+1 (555) 000-0000" required="" type="tel"/>
</div>
<!-- Password -->
<div>
<label class="label-base" for="password">Password</label>
<input autocomplete="new-password" class="input-base" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Confirm Password -->
<div>
<label class="label-base" for="confirmPassword">Confirm Password</label>
<input autocomplete="new-password" class="input-base" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-2">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors font-label-md text-label-md" type="submit">
                            Register
                        </button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-6 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Already have an account? 
                        <a class="font-medium text-primary hover:text-on-primary-fixed-variant transition-colors underline-offset-2 hover:underline" href="#">
                            Login
                        </a>
</p>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface-container w-full py-stack-lg border-t border-outline-variant mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center px-margin-desktop max-w-container-max mx-auto space-y-stack-md md:space-y-0">
<div class="text-headline-sm font-headline-sm font-bold text-on-surface">EventHub</div>
<div class="text-on-surface-variant font-body-sm text-body-sm">
                © 2024 EventHub. All rights reserved.
            </div>
<nav class="flex gap-4 font-body-sm text-body-sm">
<a class="text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">Terms of Service</a>
<a class="text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">Help Center</a>
<a class="text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">Cookie Settings</a>
</nav>
</div>
</footer>
</body></html>
