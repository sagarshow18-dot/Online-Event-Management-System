<body class="bg-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-body-md">
<!-- Nav shell is suppressed for transactional/login page per guidelines -->
<!-- Login Container -->
<main class="flex bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant overflow-hidden max-w-[1000px] w-full min-h-[600px]">
<!-- Left Side: Atmospheric Image (Hidden on Mobile) -->
<div class="hidden lg:block lg:w-1/2 relative bg-surface-container-high overflow-hidden">
<img class="absolute inset-0 w-full h-full object-cover" data-alt="A professional, high-end photograph of a modern, well-lit conference center lobby during a daytime event. Attendees are networking and walking through the spacious area. The architecture features clean lines, glass walls, and subtle greenery. The lighting is bright and natural, creating a welcoming and organized corporate atmosphere. The color palette incorporates cool whites, slate grays, and soft blue accents to match a modern corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB2XzSznO3GyYWLbllsaH-pQXGCwf04HS0b76IugCmf5b_tWJjJ3oiIYkgHrHcUSZAMRfsi9MhpLf52oZr0wdJpXntQAPzGTg0ZuTZxolSvdAjJEUGm1AlJp24tjUSPZbW2ddvL32DX4plT-WjFrxzkOUp0duil6QJOQ_j-yf3PM6j9mdBc6nmK_yExNnlYSJxDzynt8OPe0opO_upvlfbqvILQsnVEHQbcOH-6XUSEXcoT3nq2APe1DQ"/>
<!-- Gradient overlay for text contrast if needed, and to blend with brand colors -->
<div class="absolute inset-0 bg-gradient-to-t from-on-surface/40 to-transparent"></div>
</div>
<!-- Right Side: Form Canvas -->
<div class="w-full lg:w-1/2 p-margin-desktop lg:p-[64px] flex flex-col justify-center">
<div class="mb-stack-lg">
<!-- Brand Anchor -->
<div class="text-headline-lg font-headline-lg text-primary font-bold tracking-tight mb-stack-md flex items-center gap-stack-sm">
<span class="material-symbols-outlined text-[32px]">event</span>
                    EventHub
                </div>
<h1 class="text-headline-md font-headline-md text-on-surface mb-stack-sm">Sign in to your account</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Manage your events, bookings, and dashboard seamlessly.</p>
</div>
<!-- Transactional Form -->
<form action="#" class="space-y-stack-md" method="POST">
<div class="flex flex-col gap-stack-sm">
<label class="text-label-md font-label-md text-on-surface" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="w-full border border-outline-variant rounded-lg bg-surface-container-lowest pl-10 pr-4 py-3 text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-outline" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<div class="flex items-center justify-between">
<label class="text-label-md font-label-md text-on-surface" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="w-full border border-outline-variant rounded-lg bg-surface-container-lowest pl-10 pr-4 py-3 text-body-md font-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="pt-stack-sm">
<!-- Navigates to Dashboard conceptually -->
<button class="w-full bg-primary text-on-primary text-label-md font-label-md h-[48px] rounded-lg hover:bg-on-primary-fixed-variant transition-colors shadow-sm flex items-center justify-center gap-stack-sm group" type="submit">
                        Log In
                        <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-stack-lg pt-stack-lg border-t border-outline-variant text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-label-md font-semibold hover:underline decoration-2 underline-offset-4" href="#">Register now</a>
</p>
</div>
</div>
